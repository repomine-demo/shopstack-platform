version: "3.9"

services:
  auth-service:
    build: .
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://shopstack:shopstack@db:5432/auth
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shopstack
      POSTGRES_PASSWORD: shopstack
      POSTGRES_DB: auth
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopstack -d auth"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
