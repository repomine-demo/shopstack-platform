openapi: "3.0.3"
info:
  title: ShopStack API Gateway
  description: Unified entry point for all ShopStack services — proxies auth, payments, and catalog.
  version: "1.0.0"

servers:
  - url: http://localhost:5000
    description: Local development

paths:
  /api/auth/login:
    post:
      summary: Authenticate user (login)
      operationId: authLogin
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  format: email
                  description: User email address
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Successful login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid credentials
        "403":
          description: Account deactivated

  /api/auth/register:
    post:
      summary: Register new user and tenant
      operationId: authRegister
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created and tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "409":
          description: Email already registered

  /api/auth/verify:
    post:
      summary: Verify a JWT access token
      operationId: authVerify
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  user_id:
                    type: string
                  tenant_id:
                    type: string
        "401":
          description: Invalid or expired token

  /api/auth/logout:
    post:
      summary: Logout (client-side token removal)
      operationId: authLogout
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout acknowledged

  /api/payments/subscribe:
    post:
      summary: Create a new subscription
      operationId: paymentsSubscribe
      tags: [Payments]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeRequest"
      responses:
        "201":
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscribeResponse"
        "400":
          description: Payment failed (Stripe error)
        "401":
          description: Unauthorized

  /api/payments/subscribe/{subscription_id}:
    delete:
      summary: Cancel a subscription
      operationId: paymentsCancel
      tags: [Payments]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: subscription_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Subscription cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled:
                    type: boolean
        "404":
          description: Subscription not found

  /api/payments/invoices:
    get:
      summary: List invoices for the authenticated tenant
      operationId: paymentsListInvoices
      tags: [Payments]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Invoice list
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoices:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invoice"

  /products:
    get:
      summary: List products
      operationId: catalogListProducts
      tags: [Catalog]
      parameters:
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Product list

  /products/{product_id}:
    get:
      summary: Get a product by ID
      operationId: catalogGetProduct
      tags: [Catalog]
      parameters:
        - in: path
          name: product_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product details
        "404":
          description: Product not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: Short-lived JWT (15 min TTL)
        refresh_token:
          type: string
          description: Long-lived opaque token (30 day TTL)
        token_type:
          type: string
          example: bearer

    RegisterRequest:
      type: object
      required: [email, password, full_name, tenant_id]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        full_name:
          type: string
        tenant_id:
          type: string

    SubscribeRequest:
      type: object
      required: [plan, email]
      properties:
        plan:
          type: string
          enum: [starter, growth, enterprise]
        email:
          type: string
          format: email
          description: Billing email (PII)

    SubscribeResponse:
      type: object
      properties:
        subscriptionId:
          type: string
        status:
          type: string
          enum: [active, trialing, past_due]

    Invoice:
      type: object
      properties:
        id:
          type: string
        subscriptionId:
          type: string
        amountDue:
          type: number
          description: Amount in cents (Payment sensitive)
        amountPaid:
          type: number
          description: Amount in cents (Payment sensitive)
        currency:
          type: string
        status:
          type: string
          enum: [draft, open, paid, void, uncollectible]
        paidAt:
          type: string
          format: date-time
          nullable: true
