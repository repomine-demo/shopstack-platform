version: "3.9"

services:
  auth-service:
    build: ./auth-service
    ports: ["8001:8001"]
    environment:
      - DATABASE_URL=postgresql://shopstack:shopstack@db:5432/auth
      - JWT_SECRET=${JWT_SECRET}
    depends_on: [db]

  payments-service:
    build: ./payments-service
    ports: ["8002:8002"]
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - DATABASE_URL=postgresql://shopstack:shopstack@db:5432/payments
    depends_on: [auth-service, db]

  catalog-service:
    build: ./catalog-service
    ports: ["8003:8003"]
    environment:
      - DATABASE_URL=postgresql://shopstack:shopstack@db:5432/catalog
    depends_on: [db]

  api-gateway:
    build: ./api-gateway
    ports: ["5000:5000"]
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - PAYMENTS_SERVICE_URL=http://payments-service:8002
      - CATALOG_SERVICE_URL=http://catalog-service:8003
    depends_on: [auth-service, payments-service, catalog-service]

  web-frontend:
    build: ./web-frontend
    ports: ["3000:3000"]
    environment:
      - REACT_APP_API_URL=http://localhost:5000

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shopstack
      POSTGRES_PASSWORD: shopstack
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
